<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مهني AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--p:#7c5cff;--pg:#8b5cf6;--lav:#b79cff;--bg:#faf9ff;--fg:#241b3a;--mut:#6f6785;--card:#fff;--line:#e9e4f7;--acc:#f1ecff}
*{box-sizing:border-box;margin:0}
body{font-family:Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0;gap:8px}
.logo{font-weight:800;font-size:20px;color:var(--p)}
.btn{display:inline-block;background:var(--p);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:14px}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,var(--p),var(--pg));color:#fff;border-radius:24px;padding:28px 22px;margin:8px 0 20px;position:relative;overflow:hidden}
.hero p{opacity:.85;font-size:14px}
.hero h1{font-size:26px;margin:6px 0}
.search{display:flex;gap:8px;background:#fff;border-radius:16px;padding:6px;margin-top:16px}
.search input{flex:1;border:0;outline:0;padding:10px;font-size:15px;color:var(--fg);min-width:0}
.search button{background:var(--p);color:#fff;border:0;border-radius:12px;width:44px;cursor:pointer;font-size:18px}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.cards{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:640px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 2px 10px rgba(124,92,255,.07)}
.card h3{font-size:15px;margin:8px 0 4px}
.card p{font-size:12px;color:var(--mut)}
.ic{width:40px;height:40px;border-radius:14px;background:var(--acc);display:grid;place-items:center;font-size:19px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--acc);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--p);border-radius:99px}
.bar i.full{background:#ef4444}
input.f,textarea.f{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;background:#fff;color:var(--fg);outline:0}
input.f:focus,textarea.f{border-color:var(--p)}
.msg{display:flex;gap:8px;margin:10px 0}
.msg.user{flex-direction:row-reverse}
.bub{max-width:82%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.msg.user .bub{background:var(--acc);color:#3d2b8f;border-radius:16px 16px 4px}
.msg.bot .bub{background:#fff;border:1px solid var(--line);border-radius:16px 16px 4px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{font-size:24px;display:block;margin-top:4px}
.stat span{font-size:12px;color:var(--mut)}
.err{color:#dc2626;font-size:14px;margin:8px 0}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 12px}
nav.tabs a{white-space:nowrap;padding:8px 14px;border-radius:99px;font-size:13px;background:#fff;border:1px solid var(--line);color:var(--mut)}
nav.tabs a.on{background:var(--p);color:#fff;border-color:var(--p)}
.day{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
footer{text-align:center;color:var(--mut);font-size:12px;padding:30px 0}
.stars{color:#f59e0b}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="logo" href="#/">مهني AI</a>
  <div id="hdr"></div>
</header>
<main id="app">…</main>
<footer>مهني AI © 2026</footer>
</div>
<script>
/* ═══ الإعداد — الصق قيمك من Supabase → Settings → API ═══ */
const SUPABASE_URL = "https://xwpwafgcnvbbxwnkbqrv.supabase.co";
const ANON_KEY = "sb_publishable_mhm3PhdDY5l1o-xmNUrZ2g_j1cWXzpg";
const sb = window.supabase.createClient(SUPABASE_URL, ANON_KEY);

const SERVICES = [
  ["assistant","المساعد الذكي","🤖","اسأل واحصل على إجابات فورية"],
  ["resume","منشئ السيرة الذاتية","📄","سيرة احترافية في دقائق"],
  ["documents","مساعد المستندات","📑","لخّص واسأل عن نصوصك"],
  ["business","مساعد الأعمال","💼","محتوى تسويقي وعروض أسعار"],
  ["translate","الترجمة وإعادة الصياغة","🌐","ترجمة دقيقة بعدة لغات"],
];
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let session = null, profile = null, plan = "free", chats = {};

sb.auth.getSession().then(({data})=>{session=data.session; afterAuth();});
sb.auth.onAuthStateChange((_e,s)=>{session=s; afterAuth();});

async function afterAuth(){
  profile=null; plan="free";
  if(session){
    const [{data:p},{data:sub}] = await Promise.all([
      sb.from("profiles").select("*").eq("id",session.user.id).single(),
      sb.from("subscriptions").select("plan").eq("user_id",session.user.id).eq("status","active")
        .order("started_at",{ascending:false}).limit(1).maybeSingle(),
    ]);
    profile=p; plan=sub?.plan ?? p?.plan ?? "free";
    document.documentElement.dir = (p?.preferred_language==="en")?"ltr":"rtl";
  }
  render();
}

const hdr = () => {
  document.getElementById("hdr").innerHTML = session
    ? `<span class="muted">${esc(profile?.full_name||session.user.email)}</span>
       <button class="btn ghost" onclick="sb.auth.signOut().then(()=>location.hash='#/')">خروج</button>`
    : `<a class="btn" href="#/login">دخول</a>`;
};

async function fn(name, body){
  const r = await fetch(`${SUPABASE_URL}/functions/v1/${name}`,{
    method:"POST",
    headers:{"Content-Type":"application/json",apikey:ANON_KEY,
      Authorization:`Bearer ${session?.access_token??""}`},
    body: JSON.stringify(body??{}) });
  if(r.status===404) throw new Error("forbidden");
  if(!r.ok) throw new Error("e"+r.status);
  return r.json();
}

/* ─── الصفحات ─── */
const views = {
"/": async () => {
  let quota="", act="";
  if(session){
    const {data:st}=await sb.rpc("get_ai_usage_status");
    quota = `<div class="card"><div class="row"><b>⚡ رصيدك</b><a class="muted" href="#/pricing">الخطة ←</a></div>
      <div class="muted" style="margin-top:8px;font-size:12px" dir="ltr"><pre style="white-space:pre-wrap">${esc(JSON.stringify(st??{},null,1))}</pre></div></div>`;
    const {data:ev}=await sb.from("ai_requests").select("id,service_type,created_at")
      .eq("user_id",session.user.id).order("created_at",{ascending:false}).limit(4);
    act=`<div class="card"><div class="row"><b>النشاط الأخير</b><a class="muted" href="#/activity">الكل ←</a></div>
      ${(ev??[]).map(e=>`<div class="day"><span>${esc(SERVICES.find(s=>s[0]===e.service_type)?.[1]??e.service_type)}</span><span class="muted">${new Date(e.created_at).toLocaleDateString("ar")}</span></div>`).join("")||'<p class="muted" style="padding:8px 0">لا يوجد نشاط بعد</p>'}</div>`;
  }
  return `
  <section class="hero">
    <p>أهلًا بعودتك 👋</p>
    <h1>صباح الإنجاز، ${esc(profile?.full_name?.split(" ")[0]||"صديقي")}</h1>
    <p>بماذا يمكن لمهني أن يساعدك اليوم؟</p>
    <div class="search"><input id="hq" placeholder="مثال: اكتب لي خطة تسويق لمتجر ملابس"
      onkeydown="if(event.key==='Enter')location.hash='#/assistant?q='+encodeURIComponent(this.value)">
      <button onclick="location.hash='#/assistant?q='+encodeURIComponent(document.getElementById('hq').value)">➤</button></div>
  </section>
  <div class="grid2">${session?quota+'<br>'+act:'<div class="card"><p class="muted">سجّل الدخول لعرض رصيدك ونشاطك.</p><br><a class="btn" href="#/login">تسجيل الدخول</a></div>'}</div>
  <h3 style="margin:18px 0 10px">الخدمات</h3>
  <div class="cards">${SERVICES.map(([id,t,i,d])=>`
    <a class="card" href="#/${id}"><div class="ic">${i}</div><h3>${t}</h3><p>${d}</p></a>`).join("")}
  </div>`;
},

"/login": () => `
  <div class="card" style="max-width:400px;margin:30px auto">
    <h2 style="margin-bottom:12px">تسجيل الدخول</h2>
    <div style="display:grid;gap:10px">
      <input class="f" id="em" type="email" placeholder="البريد الإلكتروني" dir="ltr">
      <input class="f" id="pw" type="password" placeholder="كلمة المرور" dir="ltr">
      <div id="lerr"></div>
      <button class="btn" id="lbtn" onclick="doLogin()">دخول</button>
      <button class="btn ghost" onclick="doSignup()" id="sbtn">إنشاء حساب جديد</button>
    </div>
  </div>`,

"/activity": async () => {
  if(!session) return views["/login"]();
  const {data:rows}=await sb.from("ai_requests").select("id,service_type,prompt,created_at")
    .eq("user_id",session.user.id).order("created_at",{ascending:false}).limit(50);
  return `<h2 style="margin-bottom:12px">سجل نشاطي</h2>
  <div class="card">${(rows??[]).map(r=>`<div class="day" style="display:block">
    <div class="row"><span class="muted">${esc(r.service_type)}</span><span class="muted">${new Date(r.created_at).toLocaleString("ar")}</span></div>
    <div>${esc(r.prompt?.slice(0,140))}</div></div>`).join("")||'<p class="muted">لا يوجد نشاط بعد</p>'}</div>`;
},

"/pricing": () => `
  <div class="grid2">
    <div class="card" style="border:2px solid var(--p)">
      <h2>المجانية</h2><p style="font-size:28px;font-weight:800;margin:8px 0">0$<span class="muted" style="font-size:13px"> / شهر</span></p>
      <p class="muted">كل الخدمات الخمس بحدود واضحة.</p><br>
      <a class="btn" href="#/login" style="display:block;text-align:center">ابدأ مجانًا</a>
    </div>
    <div class="card"><h2>الاحترافية</h2><p style="font-size:28px;font-weight:800;margin:8px 0;color:var(--mut)">قريبًا</p>
      <p class="muted">حدود أعلى وأولوية معالجة.</p></div>
  </div>`,

"/admin": async () => {
  if(!session) return views["/login"]();
  let d;
  try { d = await fn("admin-stats-mehni"); }
  catch(e){ return e.message==="forbidden"
    ? `<div class="card" style="text-align:center;padding:40px"><p class="muted">غير مصرّح بلوحة الإدارة.</p></div>`
    : `<div class="card" style="text-align:center;padding:40px"><p class="err">تعذّر التحميل.</p><button class="btn" onclick="render()">إعادة المحاولة</button></div>`; }
  const k=(t,v,s)=>`<div class="stat"><span>${t}</span><b>${v}</b>${s?`<span>${s}</span>`:""}</div>`;
  const resSec=(title,rows)=>`<div class="card"><b>${title}</b><div style="margin-top:8px">
    ${(rows??[]).map(r=>`<div class="day"><span>${esc(r.name)}</span><b>${r.count}</b></div>`).join("")||'<p class="muted">لا بيانات</p>'}</div></div>`;
  return `
  <h2 style="margin-bottom:12px">لوحة الإدارة</h2>
  <p class="muted" style="margin-bottom:10px">${esc(d.window?.definition??"")}</p>
  <div class="cards" style="grid-template-columns:repeat(2,1fr)">
    ${k("المستخدمون",d.users.total,"+"+d.users.newRolling30d+" بـ30 يوم")}
    ${k("نشطون 24 ساعة",d.active.rolling24h,"متدحرجة")}
    ${k("نشطون 30 يوم",d.active.rolling30d)}
    ${k("طلبات AI",d.requests.total,d.requests.rolling30d+" بـ30 يوم")}
    ${k("متوسط التقييم",d.feedback.avgRatingLatest20,"آخر "+d.feedback.latestCount)}
    ${k("معلّقون",d.suspended)}
  </div>
  <div class="grid2" style="margin-top:12px">
    ${resSec("حجوزات — 30 يوم (quota_day)",d.reservations?.last30DaysByQuotaDate)}
    ${resSec("حجوزات — شهر "+d.window?.calendarMonth,d.reservations?.calendarMonth)}
    <div class="card"><b>الخطط</b><div style="margin-top:8px">${(d.plans??[]).map(p=>`<div class="day"><span>${esc(p.name)}</span><b>${p.count}</b></div>`).join("")}</div></div>
    <div class="card"><b>أحدث التقييمات</b><div style="margin-top:8px">
      ${(d.feedback?.latest??[]).map(f=>`<div class="day" style="display:block">
        <div class="row"><span>${esc(f.name)}</span><span class="stars">${"★".repeat(f.rating)}</span></div>
        ${f.comment?`<div class="muted">${esc(f.comment)}</div>`:""}</div>`).join("")||'<p class="muted">لا تقييمات</p>'}</div></div>
  </div>`;
},
};

/* صفحات الخدمات الخمس — محادثة */
function chatView(id,title){
  return () => {
    if(!session){ location.hash="#/login"; return ""; }
    const msgs = chats[id] ?? (chats[id]=[]);
    return `
    <div class="card" style="margin-bottom:12px"><b>${title}</b>
      <p class="muted">${esc(SERVICES.find(s=>s[0]===id)?.[3]??"")}</p></div>
    <div id="thread">${msgs.map(m=>`
      <div class="msg ${m.role}"><div class="bub">${esc(m.content)}</div></div>`).join("")}
      <div id="pending"></div></div>
    <div id="cerr"></div>
    <div class="search" style="margin-top:10px">
      <input id="qin" placeholder="اكتب هنا…" onkeydown="if(event.key==='Enter')sendMsg('${id}')">
      <button onclick="sendMsg('${id}')" id="qbtn">➤</button>
    </div>`;
  };
}
SERVICES.forEach(([id,t])=>views["/"+id]=chatView(id,t));

async function sendMsg(id){
  const inp=document.getElementById("qin"), btn=document.getElementById("qbtn");
  const text=inp.value.trim(); if(!text) return;
  const msgs=chats[id]; msgs.push({role:"user",content:text}); inp.value=""; btn.disabled=true;
  document.getElementById("cerr").innerHTML="";
  document.getElementById("thread").innerHTML = msgs.map(m=>
    `<div class="msg ${m.role}"><div class="bub">${esc(m.content)}</div></div>`).join("")
    + `<div class="msg bot" id="thinking"><div class="bub muted">يفكّر…</div></div>`;
  try{
    const r=await fn("mehni-ai",{service:id,messages:msgs});
    msgs.push({role:"assistant",content:r.content});
  }catch(e){
    document.getElementById("thinking")?.remove();
    document.getElementById("cerr").innerHTML = `<p class="err">${
      e.message==="forbidden" ? "انتهت جلستك — سجّل الدخول من جديد." :
      e.message==="e429" ? "وصلت لحد استخدامك. جرّب غدًا." :
      "تعذّر الاتصال بالمساعد حاليًا."}</p>`;
    msgs.pop();
  }
  btn.disabled=false;
  const th=document.getElementById("thread");
  th.innerHTML = msgs.map(m=>`<div class="msg ${m.role}"><div class="bub">${esc(m.content)}</div></div>`).join("");
  inp.focus(); scrollTo(0,document.body.scrollHeight);
}

/* auth actions */
async function doLogin(){
  const b=document.getElementById("lbtn"); b.disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:em.value,password:pw.value});
  b.disabled=false;
  if(error) document.getElementById("lerr").innerHTML=`<p class="err">${esc(error.message)}</p>`;
  else location.hash="#/";
}
async function doSignup(){
  const b=document.getElementById("sbtn"); b.disabled=true;
  const {error}=await sb.auth.signUp({email:em.value,password:pw.value,
    options:{data:{full_name:em.value.split("@")[0]}}});
  b.disabled=false;
  document.getElementById("lerr").innerHTML = error
    ? `<p class="err">${esc(error.message)}</p>`
    : `<p class="muted">أُرسل رابط تأكيد إلى بريدك.</p>`;
}

/* router */
async function render(){
  hdr();
  const raw=(location.hash.slice(1)||"/");
  const [path,qs]=raw.split("?");
  const view=views[path] ?? (()=>`<div class="card" style="text-align:center;padding:40px">
    <h2>404</h2><p class="muted">الصفحة غير موجودة</p><br><a class="btn" href="#/">العودة</a></div>`);
  document.getElementById("app").innerHTML = await view();
  if(path==="/assistant"&&qs){ const q=new URLSearchParams(qs).get("q");
    if(q){ document.getElementById("qin").value=q; sendMsg("assistant"); } }
  scrollTo(0,0);
}
window.addEventListener("hashchange",render);
</script>
</body>
</html>
